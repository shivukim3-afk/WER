    <style>
        /* -------------------------------------------------------------
           FONT-DISPLAY SWAP OPTIMIZATION (Zero Layout Shift & Instant Render)
        ------------------------------------------------------------- */
        @font-face {
            font-family: 'Font Awesome 6 Free';
            font-style: normal;
            font-weight: 900;
            font-display: swap;
            src: url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/fa-solid-900.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Font Awesome 6 Brands';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/webfonts/fa-brands-400.woff2') format('woff2');
        }

        :root {
            --font-main: 'Rubik', 'Outfit', sans-serif;
            --color-navy: #0a1931;
            --color-blue: #0085ff;
            --color-cyan: #00f0ff;
            --color-bg-light: #f8fafc;
            --color-border: #e2e8f0;
            --text-dark: #1e293b;
            --text-muted: #475569;
            --border-radius-lg: 16px;
            --border-radius-md: 12px;
            --border-radius-sm: 8px;
            --shadow-soft: 0 10px 30px rgba(10, 25, 49, 0.05);
            --shadow-hover: 0 20px 40px rgba(10, 25, 49, 0.1);
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--color-bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 120px;
        }

        /* Header Styling */
        .order-header {
            background: #ffffff;
            border-bottom: 1px solid var(--color-border);
            padding: 1rem 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(10, 25, 49, 0.02);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--color-navy);
            letter-spacing: -0.5px;
        }

        .logo-arrow {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 15px solid var(--color-blue);
            transform: rotate(180deg);
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--color-blue);
            color: var(--color-blue);
            padding: 0.6rem 1.2rem;
            border-radius: var(--border-radius-sm);
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition-smooth);
        }

        .back-btn:hover {
            background: var(--color-blue);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Container */
        .order-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .order-title-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .order-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--color-navy);
            margin-bottom: 0.5rem;
        }

        .order-subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Client Details Form */
        .details-card {
            background: #ffffff;
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--color-border);
            padding: 2rem;
            margin-bottom: 2.5rem;
            box-shadow: var(--shadow-soft);
        }

        .details-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--color-navy);
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid var(--color-border);
            padding-bottom: 0.6rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-weight: 700;
            color: var(--color-navy);
            font-size: 0.95rem;
        }

        input[type="text"], input[type="tel"] {
            padding: 0.8rem 1rem;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-sm);
            font-family: var(--font-main);
            font-size: 1rem;
            transition: var(--transition-smooth);
            width: 100%;
        }

        input[type="text"]:focus, input[type="tel"]:focus {
            outline: none;
            border-color: var(--color-blue);
            box-shadow: 0 0 0 3px rgba(0, 133, 255, 0.1);
        }

        /* Category Tabs */
        .category-tabs {
            display: flex;
            overflow-x: auto;
            justify-content: center;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            scrollbar-width: thin;
        }

        @media (max-width: 768px) {
            .category-tabs {
                justify-content: flex-start;
            }
        }

        .category-tab {
            background: #ffffff;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-sm);
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 700;
            color: var(--color-navy);
            transition: var(--transition-smooth);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .category-tab:hover {
            border-color: var(--color-blue);
            color: var(--color-blue);
        }

        .category-tab.active {
            background: var(--color-navy);
            color: #ffffff;
            border-color: var(--color-navy);
        }

        /* Table Card */
        .table-card {
            background: #ffffff;
            border-radius: var(--border-radius-lg);
            border: 1px solid var(--color-border);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
        }

        th, td {
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--color-border);
        }

        th {
            background-color: #f8fafc;
            color: var(--color-navy);
            font-weight: 800;
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .product-name-col {
            font-weight: 700;
            color: var(--color-navy);
        }

        .product-pack-col {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .price-text {
            font-weight: 700;
            color: var(--color-navy);
        }

        /* Quantity controls */
        .qty-controls {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            justify-content: flex-start;
        }

        .qty-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--color-border);
            background: #ffffff;
            color: var(--color-navy);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .qty-btn:hover {
            background: var(--color-blue);
            color: #ffffff;
            border-color: var(--color-blue);
        }

        .qty-input {
            width: 50px;
            text-align: center;
            padding: 0.4rem;
            border: 1px solid var(--color-border);
            border-radius: var(--border-radius-sm);
            font-family: var(--font-main);
            font-weight: 700;
            font-size: 1rem;
        }

        /* Summary Sticky Footer */
        .summary-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top: 2px solid var(--color-border);
            padding: 1.5rem 5%;
            box-shadow: 0 -10px 40px rgba(10, 25, 49, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 99;
        }

        .summary-stats {
            display: flex;
            gap: 2.5rem;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 700;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--color-navy);
        }

        .stat-value span {
            color: var(--color-blue);
        }

        .summary-actions {
            display: flex;
            gap: 1rem;
        }

        .action-btn {
            padding: 0.9rem 1.8rem;
            border-radius: var(--border-radius-md);
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: none;
            font-family: var(--font-main);
            transition: var(--transition-smooth);
        }

        .whatsapp-btn {
            background: #25d366;
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(37, 211, 102, 0.25);
        }

        .whatsapp-btn:hover {
            background: #20ba5a;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(37, 211, 102, 0.35);
        }

        .print-btn {
            background: #64748b;
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(100, 116, 139, 0.2);
        }

        .print-btn:hover {
            background: #475569;
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(100, 116, 139, 0.3);
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
            .summary-footer {
                flex-direction: column;
                gap: 1.2rem;
                padding: 1.2rem;
            }
            .summary-stats {
                width: 100%;
                justify-content: space-around;
                gap: 1rem;
            }
            .summary-actions {
                width: 100%;
            }
            .action-btn {
                flex: 1;
                justify-content: center;
                font-size: 0.95rem;
                padding: 0.8rem;
            }

            /* Responsive table layout on mobile */
            table, 
            thead, 
            tbody, 
            th, 
            td, 
            tr {
                display: block !important;
            }
            thead {
                display: none !important; /* Hide table headers */
            }
            tr {
                border-bottom: 1px solid var(--color-border) !important;
                padding: 1rem 0.2rem !important;
                position: relative !important;
                display: grid !important;
                grid-template-columns: 1fr auto !important;
                gap: 0.3rem !important;
                align-items: center !important;
            }
            td {
                padding: 0 !important;
                border: none !important;
                text-align: right !important;
            }
            td.product-name-col {
                grid-column: 1 !important;
                font-weight: 700 !important;
                font-size: 1rem !important;
                color: var(--color-navy) !important;
            }
            td.product-pack-col {
                grid-column: 1 !important;
                font-size: 0.85rem !important;
                color: var(--text-muted) !important;
            }
            td.price-text {
                grid-column: 1 !important;
                font-weight: 700 !important;
                font-size: 1rem !important;
                color: var(--color-blue) !important;
                margin-top: 0.15rem !important;
            }
            td:last-child {
                grid-column: 2 !important;
                grid-row: 1 / span 3 !important;
                display: flex !important;
                justify-content: flex-end !important;
                align-items: center !important;
            }
            .qty-controls {
                gap: 0.4rem !important;
            }
        }

        /* Print Media queries */
        @media print {
            body {
                padding-bottom: 0;
                background: #ffffff;
            }
            .order-header, .category-tabs, .summary-footer, .back-btn, .qty-btn {
                display: none !important;
            }
            .details-card, .table-card {
                box-shadow: none !important;
                border: 1px solid #000000 !important;
                margin-bottom: 1.5rem !important;
            }
            input[type="text"], input[type="tel"] {
                border: none !important;
                border-bottom: 1px solid #000000 !important;
                padding: 0.2rem !important;
            }
            .qty-input {
                border: none !important;
                font-size: 1.2rem !important;
            }
            .order-container {
                margin: 0 !important;
                max-width: 100% !important;
                padding: 0 !important;
            }
        }
    </style>
</head>

            {

            { id: "o2", image: "assets/o2.jpg", name: "טונר שחור למדפסת HP", pack: "יחידה אחת", price: 180, category: "office", portals: ["office"], icon: "toner" , keywords: ["טונר", "דיו", "מדפסת", "hp", "שחור"] },
            { id: "o3", image: "assets/o3.jpg", name: "עטי פיילוט Pilot 0.7 כחול/שחור", pack: "מארז 12 עטים", price: 65, category: "office", portals: ["office", "institution"], icon: "pen" , keywords: ["עט", "עטים", "פיילוט", "pilot", "משרד"] },
            { id: "o4", image: "assets/o4.jpg", name: "קלסר משרדי עבה גב 8 ס\"מ", pack: "מארז 10 קלסרים קשיחים", price: 80, category: "office", portals: ["office", "institution"], icon: "binders" , keywords: ["קלסר", "משרד", "תיוק", "עבה", "קרטון"] }
        ];

        // Selected quantities store
        const orderQuantities = {};
        let activeTab = 'all';

        // Initialize Page
        window.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderTable();
            updateSummary();
        });

        // Render Tabs
        function renderTabs() {
            const tabsContainer = document.getElementById('category-tabs');
            let html = `
                <div class="category-tab active" onclick="switchCategory('all', this)">
                    <span>🌟 הכול</span>
                </div>
            `;
            
            Object.keys(CATEGORIES).forEach(catId => {
                const cat = CATEGORIES[catId];
                html += `
                    <div class="category-tab" onclick="switchCategory('${catId}', this)">
                        <span>${cat.icon} ${cat.name}</span>
                    </div>
                `;
            });
            tabsContainer.innerHTML = html;
        }

        // Switch Category
        function switchCategory(catId, element) {
            document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
            if (element) element.classList.add('active');
            
            activeTab = catId;
            renderTable();
        }

        // Render Products Table
        function renderTable() {
            const tbody = document.getElementById('products-table-body');
            let html = '';
            
            const filteredProducts = activeTab === 'all' 
                ? PRODUCTS 
                : PRODUCTS.filter(p => p.category === activeTab);
                
            if (filteredProducts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">אין מוצרים בקטגוריה זו.</td></tr>`;
                return;
            }

            filteredProducts.forEach(prod => {
                const qty = orderQuantities[prod.id] || 0;
                html += `
                    <tr>
                        <td class="product-name-col">${prod.name}</td>
                        <td class="product-pack-col">${prod.pack}</td>
                        <td class="price-text">${prod.price} ₪</td>
                        <td>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="updateQty('${prod.id}', -1)">-</button>
                                <input type="number" class="qty-input" id="input-${prod.id}" min="0" max="999" value="${qty}" onchange="setQty('${prod.id}', this.value)">
                                <button class="qty-btn" onclick="updateQty('${prod.id}', 1)">+</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        // Update quantity
        function updateQty(prodId, delta) {
            const current = orderQuantities[prodId] || 0;
            const updated = Math.max(0, current + delta);
            orderQuantities[prodId] = updated;
            
            const input = document.getElementById(`input-${prodId}`);
            if (input) input.value = updated;
            
            updateSummary();
        }

        // Set quantity from input field
        function setQty(prodId, val) {
            const qty = Math.max(0, parseInt(val) || 0);
            orderQuantities[prodId] = qty;
            
            const input = document.getElementById(`input-${prodId}`);
            if (input) input.value = qty;
            
            updateSummary();
        }

        // Update price and stats summary
        function updateSummary() {
            let totalItems = 0;
            let totalPrice = 0;
            
            Object.keys(orderQuantities).forEach(id => {
                const qty = orderQuantities[id];
                if (qty > 0) {
                    const prod = PRODUCTS.find(p => p.id === id);
                    if (prod) {
                        totalItems += qty;
                        totalPrice += (prod.price * qty);
                    }
                }
            });
            
            document.getElementById('total-items').textContent = totalItems;
            document.getElementById('total-price').textContent = totalPrice;
        }

        // Send Order to WhatsApp
        function sendOrderToWhatsApp() {
            const clientName = document.getElementById('client-name').value.trim();
            const contactName = document.getElementById('contact-name').value.trim();
            const clientPhone = document.getElementById('client-phone').value.trim();
            const clientAddress = document.getElementById('client-address').value.trim();

            if (!clientName || !contactName || !clientPhone) {
                alert('אנא מלא את כל שדות החובה בפרטי המוסד (שם מוסד, איש קשר וטלפון)');
                return;
            }

            let orderText = `*הזמנה מרוכזת חדשה - שיווקים*\n\n`;
            orderText += `*פרטי המוסד:*\n`;
            orderText += `🏢 מוסד: ${clientName}\n`;
            orderText += `👤 איש קשר: ${contactName}\n`;
            orderText += `📞 טלפון: ${clientPhone}\n`;
            if (clientAddress) orderText += `📍 כתובת: ${clientAddress}\n`;
            orderText += `\n*רשימת מוצרים להזמנה:*\n`;

            let hasItems = false;
            let totalSum = 0;

            Object.keys(orderQuantities).forEach(id => {
                const qty = orderQuantities[id];
                if (qty > 0) {
                    const prod = PRODUCTS.find(p => p.id === id);
                    if (prod) {
                        hasItems = true;
                        const itemSum = prod.price * qty;
                        totalSum += itemSum;
                        orderText += `• *${prod.name}* (${prod.pack}) - כמות: *${qty}* | מחיר: ${prod.price} ₪ | סה"כ: *${itemSum}* ₪\n`;
                    }
                }
            });

            if (!hasItems) {
                alert('אנא בחר לפחות מוצר אחד להזמנה (שנה כמויות מעל 0)');
                return;
            }

            orderText += `\n💰 *סכום כולל לתשלום: ${totalSum} ₪*`;

            // Record order in DB Engine
            if (typeof db !== 'undefined') {
                const orderedItems = [];
                Object.keys(orderQuantities).forEach(id => {
                    const qty = orderQuantities[id];
                    if (qty > 0) {
                        const prod = PRODUCTS.find(p => p.id === id);
                        if (prod) orderedItems.push({ id: prod.id, name: prod.name, pack: prod.pack, price: prod.price, quantity: qty });
                    }
                });
                const vat = totalSum * 0.18;
                db.addOrder({
                    clientName: `${clientName} (${contactName})`,
                    clientPhone: clientPhone,
                    clientAddress: clientAddress,
                    items: orderedItems,
                    rawSubtotal: totalSum,
                    discount: 0,
                    couponCode: null,
                    subtotalAfterDiscount: totalSum,
                    vat: vat,
                    total: totalSum + vat,
                    paymentMethod: 'whatsapp_quick'
                });
            }

            const waText = encodeURIComponent(orderText.replace(/\\n/g, '\n'));
            const waLink = `https://wa.me/972505178445?text=${waText}`;
            
            // Open in new tab
            window.open(waLink, '_blank');
        }
    </script>
